name: Geekatoo
description: Geekatoo was a Walnut Creek, California on-demand, in-home technology support marketplace
  that connected consumers to a nationwide network of vetted local technicians for computer repair,
  network troubleshooting, TV mounting, and home-theater/smart-home installation using a fixed-price
  and competitive-bid model positioned as an alternative to retail services like Geek Squad. Founded
  in 2013, it went through the 500 Startups accelerator (sixth batch) and raised roughly $2.2M from
  backers including 500 Startups, CRCM Venture Capital, DeNA, MicroVentures, and Wefunder. In May 2016
  Geekatoo merged with Los Angeles-based HelloTech to form one of the largest on-demand in-home tech
  support networks in the US; the standalone Geekatoo brand and website (geekatoo.com) are no longer
  operational. This API Evangelist profile is a 500 Global portfolio lead retained for historical record;
  the enrichment pipeline found no live developer surface, API, or documentation to harvest.
